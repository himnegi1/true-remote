name: Daily Job Scout

on:
  schedule:
    # 03:30 UTC = 09:00 IST every day. Adjust if you like.
    - cron: "30 3 * * *"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

permissions:
  contents: write # needed to commit the updated data/seen.json

concurrency:
  group: job-scout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run job scout
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: go run .

      - name: Persist seen jobs
        run: |
          git config user.name "job-scout-bot"
          git config user.email "job-scout-bot@users.noreply.github.com"
          git add data/seen.json
          if git diff --staged --quiet; then
            echo "No new jobs to record."
          else
            git commit -m "chore: update seen jobs [skip ci]"
            git push
          fi

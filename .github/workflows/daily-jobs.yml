name: Daily Job Scout

on:
  schedule:
    # 03:30 UTC = 09:00 IST every day. Adjust if you like.
    - cron: "30 3 * * *"
  workflow_dispatch: # lets you trigger a run manually from the Actions tab
    inputs:
      dry_run:
        description: "Preview only: print the digest to the log, do NOT send Telegram or save state"
        type: boolean
        default: false

permissions:
  contents: write # needed to commit the updated data/seen.json

concurrency:
  group: job-scout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run job scout
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Optional: set LLM_API_KEY (free Groq key) to enable AI ranking.
          # LLM_BASE_URL / LLM_MODEL are optional overrides (default Groq/Llama).
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          # Multi-user mode: when both are set, the engine serves every
          # subscriber in Supabase instead of the local config.json.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          # No Telegram bot yet -> run in dashboard mode (--dry-run): refresh
          # web/matches.json without sending. Once TELEGRAM_BOT_TOKEN is set,
          # it switches to sending the digest too.
          if [ "${{ github.event.inputs.dry_run }}" = "true" ] || [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "Dashboard mode — refreshing matches.json, no Telegram send"
            go run . --dry-run
          else
            go run .
          fi

      - name: Publish dashboard feed
        run: |
          git config user.name "trueremote-bot"
          git config user.email "trueremote-bot@users.noreply.github.com"
          git add web/matches.json data/seen.json
          if git diff --staged --quiet; then
            echo "No changes to publish."
          else
            git commit -m "chore: refresh matches [skip ci]"
            git push
          fi

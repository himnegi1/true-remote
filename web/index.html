<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TrueRemote — your job inbox</title>
<style>
  :root{
    --bg:#f7f7f5; --surface:#ffffff; --border:#e6e5e0; --text:#1c1c1a;
    --muted:#6b6a64; --faint:#9a988f; --accent:#2f6df6; --accent-bg:#eaf1ff;
    --good:#0f6e56; --good-bg:#e1f5ee; --radius:12px;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#1a1a19; --surface:#242423; --border:#38372f; --text:#ececea;
      --muted:#a3a199; --faint:#75746c; --accent:#6ea0ff; --accent-bg:#1e2b45;
      --good:#5dcaa5; --good-bg:#0f3a30; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:760px;margin:0 auto;padding:24px 16px 64px}
  header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:4px}
  h1{font-size:22px;font-weight:600;margin:0;letter-spacing:-0.01em}
  h1 .mark{color:var(--accent)}
  .sub{color:var(--muted);font-size:13px}
  .skills{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 18px}
  .skill{font-size:12px;background:var(--accent-bg);color:var(--accent);padding:3px 10px;border-radius:20px}
  .tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--border)}
  .tab{background:none;border:none;color:var(--muted);font-size:14px;padding:8px 10px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab.active{color:var(--text);border-bottom-color:var(--accent);font-weight:500}
  .tab .n{color:var(--faint);font-size:12px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;transition:border-color .15s}
  .card:hover{border-color:var(--faint)}
  .card.dismissed{opacity:.5}
  .top{display:flex;gap:12px}
  .ava{width:40px;height:40px;border-radius:10px;background:var(--accent-bg);color:var(--accent);
    display:flex;align-items:center;justify-content:center;font-weight:600;font-size:16px;flex-shrink:0}
  .title{font-size:16px;font-weight:600;margin:0 0 2px;letter-spacing:-0.01em}
  .co{color:var(--muted);font-size:14px}
  .meta{color:var(--faint);font-size:13px;margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .meta .dot{opacity:.5}
  .reason{margin-top:10px;font-size:13px;color:var(--good);background:var(--good-bg);
    padding:6px 10px;border-radius:8px;display:inline-block}
  .tags{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}
  .tag{font-size:12px;color:var(--muted);background:var(--bg);border:1px solid var(--border);padding:2px 8px;border-radius:6px}
  .actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
  .btn{font-size:13px;padding:7px 14px;border-radius:8px;border:1px solid var(--border);
    background:var(--surface);color:var(--text);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
  .btn:hover{border-color:var(--faint)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}
  .empty{text-align:center;color:var(--muted);padding:60px 20px}
  .foot{color:var(--faint);font-size:12px;text-align:center;margin-top:28px}
  a{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🧭 True<span class="mark">Remote</span></h1>
    <div class="sub" id="updated"></div>
  </header>
  <div class="sub">Genuinely remote roles, matched to you — updated daily.</div>
  <div class="skills" id="skills"></div>

  <div class="tabs">
    <button class="tab active" data-f="new">New <span class="n" id="c-new"></span></button>
    <button class="tab" data-f="saved">Saved <span class="n" id="c-saved"></span></button>
    <button class="tab" data-f="dismissed">Hidden <span class="n" id="c-dismissed"></span></button>
  </div>

  <div id="list"></div>
  <div class="foot" id="foot"></div>
</div>

<script>
const KEY = "trueremote.status.v1";
let statuses = {};
try { statuses = JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){}
let jobs = [], filter = "new";

const idOf = j => j.url || (j.company + "|" + j.title);
const save = () => localStorage.setItem(KEY, JSON.stringify(statuses));
const initials = c => (c||"?").replace(/[^A-Za-z0-9 ]/g,"").trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase() || "?";
const esc = s => (s||"").replace(/[&<>"]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

function relTime(iso){
  if(!iso) return "";
  const d = new Date(iso), h = Math.round((Date.now()-d)/3.6e6);
  if(h < 1) return "just now";
  if(h < 24) return h+"h ago";
  return Math.round(h/24)+"d ago";
}

function setStatus(id, s){
  if(statuses[id] === s) delete statuses[id]; else statuses[id] = s;
  save(); render();
}

function counts(){
  let n={new:0,saved:0,dismissed:0};
  jobs.forEach(j=>{ const s=statuses[idOf(j)];
    if(s==="saved") n.saved++; else if(s==="dismissed") n.dismissed++; else n.new++; });
  return n;
}

function render(){
  const n = counts();
  document.getElementById("c-new").textContent=n.new;
  document.getElementById("c-saved").textContent=n.saved;
  document.getElementById("c-dismissed").textContent=n.dismissed;
  const list = document.getElementById("list");
  const shown = jobs.filter(j=>{
    const s = statuses[idOf(j)] || "new";
    return filter==="new" ? s==="new" : s===filter;
  });
  if(!shown.length){
    list.innerHTML = `<div class="empty">Nothing here${filter==="new"?" — you're all caught up. Check back tomorrow. 👋":"."}</div>`;
    return;
  }
  list.innerHTML = shown.map(j=>{
    const id = idOf(j), s = statuses[id]||"new";
    const meta = [j.location, j.jobType, j.salary, "via "+j.source].filter(Boolean)
      .map(esc).join(' <span class="dot">·</span> ');
    const tags = (j.tags||[]).slice(0,6).map(t=>`<span class="tag">${esc(t)}</span>`).join("");
    return `<div class="card ${s==="dismissed"?"dismissed":""}">
      <div class="top">
        <div class="ava">${esc(initials(j.company))}</div>
        <div style="min-width:0">
          <div class="title">${esc(j.title)}</div>
          <div class="co">${esc(j.company)}</div>
        </div>
      </div>
      <div class="meta">${meta}</div>
      ${j.reason?`<div class="reason">✅ ${esc(j.reason)}</div>`:""}
      ${tags?`<div class="tags">${tags}</div>`:""}
      <div class="actions">
        <a class="btn primary" href="${esc(j.url)}" target="_blank" rel="noopener">Apply ↗</a>
        <button class="btn ${s==="saved"?"on":""}" onclick="setStatus('${id.replace(/'/g,"\\'")}','saved')">★ ${s==="saved"?"Saved":"Save"}</button>
        <button class="btn" onclick="setStatus('${id.replace(/'/g,"\\'")}','dismissed')">${s==="dismissed"?"Un-hide":"✕ Hide"}</button>
      </div>
    </div>`;
  }).join("");
}

document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  t.classList.add("active"); filter=t.dataset.f; render();
});

fetch("./matches.json?"+Date.now()).then(r=>r.json()).then(d=>{
  jobs = d.jobs||[];
  document.getElementById("updated").textContent = "Updated "+relTime(d.generated);
  document.getElementById("skills").innerHTML = (d.skills||[]).map(s=>`<span class="skill">${esc(s)}</span>`).join("");
  document.getElementById("foot").textContent = `${jobs.length} matches · sources: company career portals + Remotive, Remote OK, Arbeitnow, Jobicy`;
  render();
}).catch(e=>{
  document.getElementById("list").innerHTML = `<div class="empty">Couldn't load matches. ${esc(String(e))}</div>`;
});
</script>
</body>
</html>
